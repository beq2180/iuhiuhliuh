name: Build TerminalCraft Minecraft Files

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: "Minecraft version"
        required: true
        default: "1.21.11"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build macOS ARM64 Minecraft installation
        env:
          MC_VERSION: ${{ inputs.minecraft_version }}
        run: |
          cat > /tmp/build_terminalcraft.py <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import hashlib
          import json
          import os
          import re
          import shutil
          import threading
          import urllib.request
          import zipfile
          from pathlib import Path

          VERSION = os.environ.get("MC_VERSION", "1.21.11").strip()
          OUT = Path("bundle") / "minecraft"
          VERSION_DIR = OUT / "versions" / VERSION
          LIBRARIES = OUT / "libraries"
          ASSETS = OUT / "assets"
          NATIVES = VERSION_DIR / "natives"

          MANIFEST = "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"
          USER_AGENT = "TerminalCraft-GitHub-Builder/1.0"

          lock = threading.Lock()
          progress = {"done": 0, "total": 0}

          def sha1_file(path: Path) -> str:
              h = hashlib.sha1()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def request_bytes(url: str) -> bytes:
              req = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
              with urllib.request.urlopen(req, timeout=90) as r:
                  return r.read()

          def download(url: str, dest: Path, expected_sha1: str = "", expected_size: int = 0):
              dest.parent.mkdir(parents=True, exist_ok=True)

              if dest.exists():
                  size_ok = not expected_size or dest.stat().st_size == expected_size
                  sha_ok = not expected_sha1 or sha1_file(dest).lower() == expected_sha1.lower()
                  if size_ok and sha_ok:
                      return "skip", dest

              temp = dest.with_suffix(dest.suffix + ".part")
              if temp.exists():
                  temp.unlink()

              data = request_bytes(url)
              temp.write_bytes(data)

              if expected_size and temp.stat().st_size != expected_size:
                  temp.unlink(missing_ok=True)
                  raise RuntimeError(
                      f"Size mismatch for {url}: got {len(data)}, expected {expected_size}"
                  )

              if expected_sha1:
                  actual = sha1_file(temp)
                  if actual.lower() != expected_sha1.lower():
                      temp.unlink(missing_ok=True)
                      raise RuntimeError(
                          f"SHA-1 mismatch for {url}: got {actual}, expected {expected_sha1}"
                      )

              temp.replace(dest)
              return "download", dest

          def json_from_url(url: str):
              return json.loads(request_bytes(url).decode("utf-8"))

          def rule_os_matches(os_rule: dict) -> bool:
              if not os_rule:
                  return True

              name = os_rule.get("name")
              if name and name != "osx":
                  return False

              arch = str(os_rule.get("arch", "")).lower()
              if arch and arch not in {"arm64", "aarch64", "aarch_64"}:
                  return False

              version_regex = os_rule.get("version")
              if version_regex:
                  # A generic recent macOS version for rule matching.
                  try:
                      if re.search(version_regex, "15.0") is None:
                          return False
                  except re.error:
                      return False

              return True

          def rules_allow(lib: dict) -> bool:
              rules = lib.get("rules")
              if not rules:
                  return True

              allowed = False
              for rule in rules:
                  # Feature-dependent library rules are not applicable to the
                  # plain launcher installation we're building.
                  if rule.get("features"):
                      matches = False
                  else:
                      matches = rule_os_matches(rule.get("os", {}))

                  if matches:
                      allowed = rule.get("action") == "allow"

              return allowed

          def artifact_is_wrong_platform(path: str) -> bool:
              p = path.lower()

              wrong = (
                  "natives-linux",
                  "natives-windows",
                  "linux-aarch_64",
                  "linux-x86_64",
                  "windows-x86",
                  "windows-arm64",
                  "windows-aarch64",
                  "osx-x86_64",
                  "macos-x86_64",
              )
              if any(x in p for x in wrong):
                  return True

              # New Minecraft manifests can list both Intel/generic macOS and
              # ARM64 LWJGL natives. Prefer the explicit ARM64 native.
              if ("natives-macos" in p or "natives-osx" in p):
                  if "arm64" not in p and "aarch64" not in p and "aarch_64" not in p:
                      return True

              return False

          def is_arm64_native(path: str) -> bool:
              p = path.lower()
              native_markers = (
                  "natives-macos-arm64",
                  "natives-osx-arm64",
                  "natives-macos-aarch64",
                  "natives-osx-aarch64",
                  "osx-aarch_64",
                  "macos-aarch_64",
                  "macos-arm64",
              )
              return any(x in p for x in native_markers)

          print(f"Building Minecraft {VERSION} for TerminalCraft / macOS ARM64")
          print()

          # Resolve official version JSON.
          manifest = json_from_url(MANIFEST)
          entry = next((v for v in manifest["versions"] if v["id"] == VERSION), None)
          if not entry:
              raise SystemExit(f"Minecraft version {VERSION!r} was not found in Mojang's manifest.")

          version_data = json_from_url(entry["url"])

          VERSION_DIR.mkdir(parents=True, exist_ok=True)
          version_json_path = VERSION_DIR / f"{VERSION}.json"
          version_json_path.write_text(
              json.dumps(version_data, indent=2),
              encoding="utf-8",
          )
          print("Saved version JSON")

          # Client JAR.
          client = version_data["downloads"]["client"]
          download(
              client["url"],
              VERSION_DIR / f"{VERSION}.jar",
              client.get("sha1", ""),
              client.get("size", 0),
          )
          print("Saved client JAR")

          # Libraries for macOS ARM64.
          jobs = []
          native_jars = []

          for lib in version_data.get("libraries", []):
              if not rules_allow(lib):
                  continue

              downloads = lib.get("downloads", {})
              artifact = downloads.get("artifact")

              if artifact and artifact.get("url") and artifact.get("path"):
                  rel = artifact["path"]
                  if not artifact_is_wrong_platform(rel):
                      dest = LIBRARIES / rel
                      jobs.append((
                          artifact["url"],
                          dest,
                          artifact.get("sha1", ""),
                          artifact.get("size", 0),
                      ))
                      if is_arm64_native(rel):
                          native_jars.append(dest)

              # Compatibility with older-style native classifier manifests.
              classifiers = downloads.get("classifiers", {})
              native_template = lib.get("natives", {}).get("osx")
              if native_template and classifiers:
                  candidates = [
                      native_template.replace("${arch}", "arm64"),
                      native_template.replace("${arch}", "aarch64"),
                      native_template.replace("${arch}", "aarch_64"),
                  ]
                  chosen = None
                  for key in candidates:
                      if key in classifiers:
                          chosen = classifiers[key]
                          break

                  if chosen and chosen.get("url") and chosen.get("path"):
                      rel = chosen["path"]
                      if not artifact_is_wrong_platform(rel):
                          dest = LIBRARIES / rel
                          jobs.append((
                              chosen["url"],
                              dest,
                              chosen.get("sha1", ""),
                              chosen.get("size", 0),
                          ))
                          native_jars.append(dest)

          # Logging config.
          log_file = version_data.get("logging", {}).get("client", {}).get("file")
          if log_file and log_file.get("url"):
              log_id = log_file.get("id", "client-log.xml")
              jobs.append((
                  log_file["url"],
                  ASSETS / "log_configs" / log_id,
                  log_file.get("sha1", ""),
                  log_file.get("size", 0),
              ))

          # Deduplicate exact destination paths.
          unique = {}
          for job in jobs:
              unique[str(job[1])] = job
          jobs = list(unique.values())

          print(f"Downloading {len(jobs)} library/logging files...")
          errors = []

          def do_job(job):
              try:
                  return download(*job)
              except Exception as e:
                  return e, job

          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              futures = [ex.submit(do_job, j) for j in jobs]
              for i, fut in enumerate(concurrent.futures.as_completed(futures), 1):
                  result = fut.result()
                  if isinstance(result, tuple) and result and isinstance(result[0], Exception):
                      errors.append(result)
                  if i % 10 == 0 or i == len(futures):
                      print(f"  libraries: {i}/{len(futures)}")

          if errors:
              for err, job in errors[:20]:
                  print("FAILED:", job[0], err)
              raise SystemExit(f"{len(errors)} library downloads failed.")

          # Asset index.
          asset_index = version_data.get("assetIndex")
          if asset_index:
              asset_index_path = ASSETS / "indexes" / f"{asset_index['id']}.json"
              download(
                  asset_index["url"],
                  asset_index_path,
                  asset_index.get("sha1", ""),
                  asset_index.get("size", 0),
              )
              asset_data = json.loads(asset_index_path.read_text(encoding="utf-8"))

              asset_jobs = []
              seen_hashes = set()
              for obj in asset_data.get("objects", {}).values():
                  h = obj["hash"]
                  if h in seen_hashes:
                      continue
                  seen_hashes.add(h)
                  url = f"https://resources.download.minecraft.net/{h[:2]}/{h}"
                  dest = ASSETS / "objects" / h[:2] / h
                  asset_jobs.append((url, dest, h, obj.get("size", 0)))

              print(f"Downloading {len(asset_jobs)} asset objects...")

              asset_errors = []
              with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
                  futures = [ex.submit(do_job, j) for j in asset_jobs]
                  for i, fut in enumerate(concurrent.futures.as_completed(futures), 1):
                      result = fut.result()
                      if isinstance(result, tuple) and result and isinstance(result[0], Exception):
                          asset_errors.append(result)
                      if i % 250 == 0 or i == len(futures):
                          print(f"  assets: {i}/{len(futures)}")

              if asset_errors:
                  for err, job in asset_errors[:20]:
                      print("FAILED:", job[0], err)
                  raise SystemExit(f"{len(asset_errors)} asset downloads failed.")

          # Extract ARM64 native JARs into the default native directory expected
          # by minecraft-launcher-lib.
          NATIVES.mkdir(parents=True, exist_ok=True)

          extracted = 0
          for jar in sorted(set(native_jars)):
              if not jar.exists():
                  continue
              try:
                  with zipfile.ZipFile(jar) as zf:
                      for info in zf.infolist():
                          name = info.filename
                          if name.endswith("/") or name.upper().startswith("META-INF/"):
                              continue

                          # Prevent zip-slip.
                          target = (NATIVES / name).resolve()
                          natives_root = NATIVES.resolve()
                          if natives_root not in target.parents and target != natives_root:
                              continue

                          target.parent.mkdir(parents=True, exist_ok=True)
                          with zf.open(info) as src, target.open("wb") as dst:
                              shutil.copyfileobj(src, dst)
                          extracted += 1
              except zipfile.BadZipFile:
                  print("Warning: not a ZIP/JAR:", jar)

          print(f"Extracted {extracted} native files into {NATIVES}")

          # A small marker explaining this payload.
          (OUT / "TERMINALCRAFT_OFFLINE_BUILD.txt").write_text(
              f"TerminalCraft offline Minecraft payload\n"
              f"Version: {VERSION}\n"
              f"Platform: macOS ARM64\n",
              encoding="utf-8",
          )

          # Package it.
          archive_base = Path(f"TerminalCraft-{VERSION}-macOS-ARM64")
          archive = shutil.make_archive(
              str(archive_base),
              "zip",
              root_dir="bundle",
              base_dir="minecraft",
          )

          print()
          print("BUILD COMPLETE")
          print("Archive:", archive)
          print("Size:", Path(archive).stat().st_size, "bytes")
          PY

          python /tmp/build_terminalcraft.py

      - name: Show archive
        run: |
          ls -lh TerminalCraft-*-macOS-ARM64.zip

      - name: Upload finished Minecraft package
        uses: actions/upload-artifact@v4
        with:
          name: TerminalCraft-${{ inputs.minecraft_version }}-macOS-ARM64
          path: TerminalCraft-${{ inputs.minecraft_version }}-macOS-ARM64.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
